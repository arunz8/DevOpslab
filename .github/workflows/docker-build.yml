
name: Docker Build

on:
  push:
    branches:
      - main
      - feature/DockerContainers

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Login to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 3: Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./Dockers
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-python-app:latest

      # Step 4: Run container for testing
      - name: Run container
        run: |
          docker run -d --name test-container \
            ${{ secrets.DOCKERHUB_USERNAME }}/my-python-app:latest \
            sh -c "python app.py && sleep 30"
          docker ps -a

      # Step 5: Stop container
      - name: Stop container
        if: always()
        run: docker stop test-container || true

      # Step 6: Remove container
      - name: Remove container
        if: always()
        run: docker rm test-container || true
